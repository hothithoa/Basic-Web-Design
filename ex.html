<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Exercise Simple Match</title>
    <link rel="stylesheet" href="">
    <script src="code.js">
    </script>
</head>
<body>
    Number A (*) <br>
    <input type="text" name="" id="numbera"> <br>

    Number B (*)<br>
    <input type="text" name="" id="numberb"> <br>
    <br>

    Summation :
    <br>
    <input type="button" name="" value="+" onclick="result(cong(getValueA(),getValueB()));">
    <br>

    Subtraction :
    <br>
    <input type="button" name="" value="-" onclick="result(tru(getValueA(),getValueB()));">
    <br>

    Multiplication :
    <br>
    <input type="button" name="" value="*" onclick="result(nhan(getValueA(),getValueB()));">
    <br>

    Division :
    <input type="button" name="" value="/" onclick="result(chia(getValueA(),getValueB()));">
    <br>
    <br>

    Result A & B:<br>
    <input type="text" name="" id="result" disabled="true">
</body>
</html>
